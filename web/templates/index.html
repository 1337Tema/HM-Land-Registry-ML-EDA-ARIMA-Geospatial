<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прогноз цен на недвижимость</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Прогноз цены недвижимости<br>в Великобритании</h1>

        {% if prediction_error %}
            <div class.alert-danger" style="background-color: #f8d7da; color: #721c24; padding: 10px; border: 1px solid #f5c6cb; border-radius: 5px; margin-bottom: 15px;">
                Ошибка: {{ prediction_error }}
            </div>
        {% endif %}

        <form class="predict-form" method="post" action="{{ url_for('predict_price') }}">
            <div class="form-group">
                <label>Тип недвижимости</label>
                <select name="property_type" required>
                    {% for pt_option in property_types %}
                        <option value="{{ pt_option }}" {% if form_data and form_data.type == pt_option %}selected{% endif %}>{{ pt_option }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Новое или вторичное жильё</label>
                <div class="radio-group">
                    <input type="radio" name="new_build" value="Y" {% if not form_data or form_data.new_build == 'Y' %}checked{% endif %}> Новое
                    <input type="radio" name="new_build" value="N" {% if form_data and form_data.new_build == 'N' %}checked{% endif %}> Вторичное
                </div>
            </div>

            <div class="form-group">
                <label>Тип владения</label>
                <select name="duration" required>
                     {% for d_option in durations %}
                        <option value="{{ d_option }}" {% if form_data and form_data.duration == d_option %}selected{% endif %}>{{ d_option }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>PPD Category Type</label>
                <select name="ppd_type" required>
                    {% for ppd_option in ppd_types_options %}
                        <option value="{{ ppd_option }}" {% if form_data and form_data.ppd_type == ppd_option %}selected{% endif %}>{{ ppd_option }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Город</label>
                <select name="city" required>
                    {% for city_option in cities %}
                        <option value="{{ city_option }}" {% if form_data and form_data.city == city_option %}selected{% endif %}>{{ city_option }}</option>
                    {% else %}
                        <option value="LONDON">LONDON</option> 
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Графство</label>
                <select name="county" required>
                     {% for county_option in counties %}
                        <option value="{{ county_option }}" {% if form_data and form_data.county == county_option %}selected{% endif %}>{{ county_option }}</option>
                    {% else %}
                        <option value="GREATER LONDON">GREATER LONDON</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Дата сделки</label>
                <input type="date" name="date" value="{{ form_data.transaction_date if form_data else '2024-01-01' }}" required>
            </div>

            <button type="submit" class="predict-button">Рассчитать</button>
        </form>

        {% if prediction %}
        <div class="result">
            <div class="alert-success">
                Ожидаемая цена: £{{ prediction }}
            </div>
        </div>
        {% endif %}

    </div>
</body>
</html>
